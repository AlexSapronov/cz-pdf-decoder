[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cz-pdf-decoder"
version = "1.0.0"
description = "Честный ЗНАК: DataMatrix декодер из PDF → Excel"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24",
    "Pillow>=10.0",
    "pylibdmtx>=0.1.9",
    "openpyxl>=3.1",
    "tksheet>=7.0",
]

[project.optional-dependencies]
gui = ["tkinterdnd2>=0.4"]
dev = ["pytest>=8.0"]
# Web-версия (experimental). Отдельный extra, чтобы desktop requirements
# (и PyInstaller build) не тянули FastAPI/uvicorn без необходимости.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
